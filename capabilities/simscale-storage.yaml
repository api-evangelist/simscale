naftiko: 1.0.0-alpha2
info:
  label: SimScale REST API — Storage
  description: 'SimScale REST API — Storage. 1 operations. Lead operation: Create Storage. Self-contained Naftiko capability
    covering one Simscale business surface.'
  tags:
  - Simscale
  - Storage
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SIMSCALE_API_KEY: SIMSCALE_API_KEY
capability:
  consumes:
  - type: http
    namespace: simscale-storage
    baseUri: https://api.simscale.com
    description: SimScale REST API — Storage business capability. Self-contained, no shared references.
    resources:
    - name: v0-storage
      path: /v0/storage
      operations:
      - name: createstorage
        method: POST
        description: Create Storage
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: apikey
      key: X-API-KEY
      value: '{{env.SIMSCALE_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: simscale-storage-rest
    port: 8080
    description: REST adapter for SimScale REST API — Storage. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/v0/storage
      name: v0-storage
      description: REST surface for v0-storage.
      operations:
      - method: POST
        name: createstorage
        description: Create Storage
        call: simscale-storage.createstorage
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: simscale-storage-mcp
    port: 9090
    transport: http
    description: MCP adapter for SimScale REST API — Storage. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: create-storage
      description: Create Storage
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: simscale-storage.createstorage
      outputParameters:
      - type: object
        mapping: $.
