  summary: SimScale provides a well-designed REST API for cloud-based engineering simulation (CFD, FEA, thermal). Swagger UI is available at api.simscale.com/apidoc. Python and C# SDKs are open-source on GitHub. API access requires an Enterprise plan. Clean resource hierarchy (project > geometry > simulation > mesh > run > results).
